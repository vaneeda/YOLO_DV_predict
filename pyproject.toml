[project]
name = "yolo-dv-predict"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.3.3",
    "ultralytics>=8.4.117",
    "torch",
    "torchvision",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "lxml>=5.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
